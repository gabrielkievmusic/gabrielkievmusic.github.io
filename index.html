<!DOCTYPE html>

    <title>gkm.OS</title>

    <link rel="stylesheet" href="dist/style.css">

</head>
<body>

    <!-- Desktop div -->
    <div id="desktop">
        <div class="desktop-icon" id="about-me">
            <img src="images/icons/doc-icon.png" alt="About Me">

            <!-- Demo folder -->
            <div class="desktop-icon" id="demo-folder">
                <img src="images/icons/folder-icon.png" alt="Demo Folder">
                <p>Soundcloud</p>
            </div>
        </a>
        



    </div>

    <script src="js/main.js"></script>
